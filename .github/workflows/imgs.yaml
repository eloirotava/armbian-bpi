name: Build Armbian Multi-Board (Trixie Minimal) Current e Edge

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da Release (ex: v1.0.0). Vira a tag e o nome da release."
        required: true
        type: string
      prerelease:
        description: "Marcar a release como pre-release"
        required: false
        type: boolean
        default: false

# CRÍTICO: Dá permissão ao GitHub Actions para criar a Release
permissions:
  contents: write

jobs:
  armbian-build:
    name: Compilando ${{ matrix.branch }} (${{ matrix.board }})
    runs-on: ubuntu-latest

    strategy:
      # Uma placa quebrada não pode derrubar as outras 7
      fail-fast: false
      matrix:
        board:
          - bananapi
          - aml-s9xx-box
          - rk322x-box
          - aml-s805-mxq
        branch:
          - current
          - edge

    steps:
      - name: Liberando espaço no Runner (Essencial)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker image prune -af
          df -h /

      - name: Preparando o Tradutor QEMU (Intel -> ARM)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Baixando o Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: armbian-build

      - name: Executando o Compile.sh
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD=${{ matrix.board }} \
            BRANCH=${{ matrix.branch }} \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=xz

      # Tudo vai para release-staging/<placa>-<branch>/, para que os 8 builds
      # possam ser mesclados depois sem um sobrescrever o .deb do outro.
      - name: Compactando os Headers (.deb) e organizando por placa
        if: success()
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" armbian-build/output/
          DEST="release-staging/${{ matrix.board }}-${{ matrix.branch }}"
          mkdir -p "$DEST"

          # A imagem já sai em .xz por causa do COMPRESS_OUTPUTIMAGE
          find armbian-build/output/images -maxdepth 1 -type f -name '*.xz' \
            -exec cp -t "$DEST" {} +

          # Headers e demais pacotes. Perder os .deb não pode custar a imagem
          # que já compilou, então daqui pra baixo falha vira aviso.
          set +e
          PREFIX="${{ matrix.board }}-${{ matrix.branch }}"
          if [ -d armbian-build/output/debs ]; then
            find armbian-build/output/debs -type f -name '*.deb' -print0 \
              | xargs -0 -r xz -9 -T0 \
              || echo "::warning::Falha ao compactar algum .deb de $PREFIX"
            # Assets de release no GitHub são planos: sem o prefixo, pacotes
            # comuns a várias placas (armbian-firmware, armbian-config...)
            # se sobrescreveriam entre si.
            find armbian-build/output/debs -type f -name '*.deb.xz' -print0 \
              | while IFS= read -r -d '' f; do
                  cp "$f" "$DEST/${PREFIX}__$(basename "$f")"
                done
          else
            echo "::warning::Sem output/debs para $PREFIX"
          fi

          ls -la "$DEST"

      - name: Resgatando a Imagem e Headers temporariamente
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Artefatos-${{ matrix.board }}-${{ matrix.branch }}
          include-hidden-files: false
          # Sem imagem não há o que publicar; com imagem e sem headers, publica assim mesmo
          if-no-files-found: error
          retention-days: 1
          path: release-staging

  publish-release:
    name: Publicar na Aba Releases
    needs: armbian-build
    runs-on: ubuntu-latest
    # O ponto central: publica o que compilou, mesmo que placas tenham falhado.
    # Só não roda se o workflow inteiro for cancelado.
    if: ${{ !cancelled() }}

    steps:
      - name: Baixar todos os artefatos gerados
        uses: actions/download-artifact@v4
        with:
          path: artefatos-finais
          pattern: Artefatos-*
          merge-multiple: true

      - name: Inspecionar arquivos e montar o resumo do build
        id: check
        run: |
          mkdir -p artefatos-finais
          find artefatos-finais -type f | sort

          if [ -z "$(find artefatos-finais -type f -name '*.xz' -print -quit)" ]; then
            echo "::error::Nenhuma placa compilou com sucesso. Nada a publicar."
            exit 1
          fi

          {
            echo "Compilação automatizada via GitHub Actions das imagens minimalistas"
            echo "(Debian Trixie / BUILD_MINIMAL) e headers, nas branches \`current\` e \`edge\`."
            echo
            echo "Resultado da matriz de build: **${{ needs.armbian-build.result }}**"
            echo
            echo "### Placas publicadas"
            echo

            # Cada build ficou em seu próprio diretório <placa>-<branch>/
            for dir in artefatos-finais/*/; do
              [ -d "$dir" ] || continue
              echo "<details><summary><b>$(basename "$dir")</b></summary>"
              echo
              find "$dir" -type f -name '*.xz' -printf '%f\t%s\n' \
                | sort \
                | awk -F'\t' '{ printf "- `%s` (%.1f MiB)\n", $1, $2/1048576 }'
              echo
              echo "</details>"
            done

            echo
            echo "> Combinações que não aparecem acima falharam na compilação;"
            echo "> veja os logs da run para o motivo."
          } > release-body.md

          cat release-body.md

      - name: Criar a Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Armbian Trixie Minimal - ${{ inputs.version }}"
          body_path: release-body.md
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: false
          files: artefatos-finais/**/*.xz
